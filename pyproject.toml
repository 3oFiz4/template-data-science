[project]
name = "project-name"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.6.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2.0",
    "nbstripout>=0.8.1",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_name"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.nbstripout]
extra_keys = [
    "metadata.kernelspec",
    "metadata.language_info.version",
]
